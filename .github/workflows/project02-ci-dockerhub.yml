name: Project02 CI - Build and Push Docker Images

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

env:
  JAVA_VERSION: "25"
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    name: Build ${{ matrix.image_repo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Java backend services
          - service: product
            source_dir: product
            dockerfile: product/Dockerfile
            type: java
            image_repo: yas-product
            extra_image_repo: ""
          - service: cart
            source_dir: cart
            dockerfile: cart/Dockerfile
            type: java
            image_repo: yas-cart
            extra_image_repo: ""
          - service: order
            source_dir: order
            dockerfile: order/Dockerfile
            type: java
            image_repo: yas-order
            extra_image_repo: ""
          - service: customer
            source_dir: customer
            dockerfile: customer/Dockerfile
            type: java
            image_repo: yas-customer
            extra_image_repo: ""
          - service: inventory
            source_dir: inventory
            dockerfile: inventory/Dockerfile
            type: java
            image_repo: yas-inventory
            extra_image_repo: ""
          - service: tax
            source_dir: tax
            dockerfile: tax/Dockerfile
            type: java
            image_repo: yas-tax
            extra_image_repo: ""
          - service: media
            source_dir: media
            dockerfile: media/Dockerfile
            type: java
            image_repo: yas-media
            extra_image_repo: ""
          - service: search
            source_dir: search
            dockerfile: search/Dockerfile
            type: java
            image_repo: yas-search
            extra_image_repo: ""
          - service: storefront-bff
            source_dir: storefront-bff
            dockerfile: storefront-bff/Dockerfile
            type: java
            image_repo: yas-storefront-bff
            extra_image_repo: ""
          - service: backoffice-bff
            source_dir: backoffice-bff
            dockerfile: backoffice-bff/Dockerfile
            type: java
            image_repo: yas-backoffice-bff
            extra_image_repo: ""

          # Frontend source folders in the current YAS repo are storefront and backoffice.
          # The application/deployment names are storefront-ui and backoffice-ui.
          # We push both official chart-compatible image names and assignment-friendly aliases.
          - service: storefront-ui
            source_dir: storefront
            dockerfile: storefront/Dockerfile
            type: frontend
            image_repo: yas-storefront
            extra_image_repo: yas-storefront-ui
          - service: backoffice-ui
            source_dir: backoffice
            dockerfile: backoffice/Dockerfile
            type: frontend
            image_repo: yas-backoffice
            extra_image_repo: yas-backoffice-ui

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve Docker tags
        id: vars
        shell: bash
        run: |
          echo "full_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "branch_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "Full commit id: ${GITHUB_SHA}"
          echo "Branch name: ${GITHUB_REF_NAME}"

      - name: Check Dockerfile exists
        shell: bash
        run: |
          echo "Checking Dockerfile: ${{ matrix.dockerfile }}"
          if [ ! -f "${{ matrix.dockerfile }}" ]; then
            echo "Dockerfile not found: ${{ matrix.dockerfile }}"
            echo "Existing Dockerfiles:"
            find . -maxdepth 3 -name Dockerfile -print
            exit 1
          fi

      - name: Set up Java
        if: ${{ matrix.type == 'java' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build Maven artifact
        if: ${{ matrix.type == 'java' }}
        shell: bash
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            MVN="./mvnw"
          else
            MVN="mvn"
          fi
          echo "Building Maven artifact for service: ${{ matrix.service }}"
          $MVN -B -pl "${{ matrix.source_dir }}" -am -DskipTests package
          echo "Target folder:"
          ls -la "${{ matrix.source_dir }}/target"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker metadata
        id: meta
        shell: bash
        run: |
          if [ -z "${DOCKERHUB_NAMESPACE}" ]; then
            echo "Missing DOCKERHUB_USERNAME secret"
            exit 1
          fi

          TAGS="${DOCKERHUB_NAMESPACE}/${{ matrix.image_repo }}:${GITHUB_SHA}"

          if [ -n "${{ matrix.extra_image_repo }}" ]; then
            TAGS="${TAGS},${DOCKERHUB_NAMESPACE}/${{ matrix.extra_image_repo }}:${GITHUB_SHA}"
          fi

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAGS="${TAGS},${DOCKERHUB_NAMESPACE}/${{ matrix.image_repo }}:main,${DOCKERHUB_NAMESPACE}/${{ matrix.image_repo }}:latest"
            if [ -n "${{ matrix.extra_image_repo }}" ]; then
              TAGS="${TAGS},${DOCKERHUB_NAMESPACE}/${{ matrix.extra_image_repo }}:main,${DOCKERHUB_NAMESPACE}/${{ matrix.extra_image_repo }}:latest"
            fi
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Docker tags: ${TAGS}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.source_dir }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.branch=${{ github.ref_name }}
            org.opencontainers.image.service=${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.image_repo }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_repo }}
