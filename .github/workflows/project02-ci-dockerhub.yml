name: Project02 CI - Build YAS Docker images

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: product
            context: product
            image: yas-product
          - service: cart
            context: cart
            image: yas-cart
          - service: order
            context: order
            image: yas-order
          - service: customer
            context: customer
            image: yas-customer
          - service: inventory
            context: inventory
            image: yas-inventory
          - service: tax
            context: tax
            image: yas-tax
          - service: media
            context: media
            image: yas-media
          - service: search
            context: search
            image: yas-search
          - service: storefront-bff
            context: storefront-bff
            image: yas-storefront-bff
          - service: backoffice-bff
            context: backoffice-bff
            image: yas-backoffice-bff
          - service: storefront-ui
            context: storefront
            image: yas-storefront
          - service: backoffice-ui
            context: backoffice
            image: yas-backoffice

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: vars
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          TAGS="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${SHORT_SHA}"

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAGS+=$'\n'"docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:main"
            TAGS+=$'\n'"docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
            TAGS+=$'\n'"docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${RELEASE_TAG}"
          fi

          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Check Dockerfile exists
        shell: bash
        run: |
          if [[ ! -f "${{ matrix.context }}/Dockerfile" ]]; then
            echo "Dockerfile not found at ${{ matrix.context }}/Dockerfile"
            echo "If YAS changes Dockerfile layout, update matrix.context/file in .github/workflows/project02-ci-dockerhub.yml"
            exit 1
          fi
      - name: Set up Java
        if: ${{ matrix.service != 'storefront-ui' && matrix.service != 'backoffice-ui' }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"

      - name: Build Maven artifact
        if: ${{ matrix.service != 'storefront-ui' && matrix.service != 'backoffice-ui' }}
        shell: bash
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            MVN="./mvnw"
          else
            MVN="mvn"
          fi

          $MVN -B -pl "${{ matrix.context }}" -am -DskipTests package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Print image summary
        shell: bash
        run: |
          echo "Built service: ${{ matrix.service }}"
          echo "Commit tag: ${{ steps.vars.outputs.short_sha }}"
          echo "Image tags:"
          echo "${{ steps.vars.outputs.tags }}"
