name: Project02 CI - Build and Push Docker Images

on:
  push:
    branches:
      - "**"

  workflow_dispatch:

env:
  JAVA_VERSION: "25"
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Java backend services
          - service: product
            context: product
            dockerfile: product/Dockerfile
            type: java

          - service: cart
            context: cart
            dockerfile: cart/Dockerfile
            type: java

          - service: order
            context: order
            dockerfile: order/Dockerfile
            type: java

          - service: customer
            context: customer
            dockerfile: customer/Dockerfile
            type: java

          - service: inventory
            context: inventory
            dockerfile: inventory/Dockerfile
            type: java

          - service: tax
            context: tax
            dockerfile: tax/Dockerfile
            type: java

          - service: media
            context: media
            dockerfile: media/Dockerfile
            type: java

          - service: search
            context: search
            dockerfile: search/Dockerfile
            type: java

          - service: storefront-bff
            context: storefront-bff
            dockerfile: storefront-bff/Dockerfile
            type: java

          - service: backoffice-bff
            context: backoffice-bff
            dockerfile: backoffice-bff/Dockerfile
            type: java

          # Frontend services
          # Service name vẫn để storefront-ui/backoffice-ui cho đúng cách gọi trong report/deploy,
          # nhưng source folder thật trong repo YAS là storefront và backoffice.
          - service: storefront-ui
            context: storefront
            dockerfile: storefront/Dockerfile
            type: frontend

          - service: backoffice-ui
            context: backoffice
            dockerfile: backoffice/Dockerfile
            type: frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve Docker tags
        id: vars
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BRANCH_NAME="${GITHUB_REF_NAME}"

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

          echo "Full commit id: ${GITHUB_SHA}"
          echo "Short commit id: ${SHORT_SHA}"
          echo "Branch name: ${BRANCH_NAME}"

      - name: Check Dockerfile exists
        shell: bash
        run: |
          echo "Checking Dockerfile: ${{ matrix.dockerfile }}"
          if [ ! -f "${{ matrix.dockerfile }}" ]; then
            echo "Dockerfile not found: ${{ matrix.dockerfile }}"
            echo "Repository folder structure:"
            find . -maxdepth 2 -name "Dockerfile" -print
            exit 1
          fi

      - name: Set up Java
        if: ${{ matrix.type == 'java' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build Maven artifact
        if: ${{ matrix.type == 'java' }}
        shell: bash
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            MVN="./mvnw"
          else
            MVN="mvn"
          fi

          echo "Building Maven artifact for service: ${{ matrix.service }}"
          $MVN -B -pl "${{ matrix.context }}" -am -DskipTests package

          echo "Checking target folder:"
          ls -la "${{ matrix.context }}/target" || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker metadata
        id: meta
        shell: bash
        run: |
          IMAGE_NAME="${{ env.DOCKERHUB_NAMESPACE }}/yas-${{ matrix.service }}"

          TAGS="${IMAGE_NAME}:${GITHUB_SHA}"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:main,${IMAGE_NAME}:latest"
          fi

          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

          echo "Docker image: ${IMAGE_NAME}"
          echo "Docker tags: ${TAGS}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.branch=${{ github.ref_name }}
            org.opencontainers.image.service=${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
